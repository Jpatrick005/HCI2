<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Past Exhibitions | Yale School of Art</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="site-shell" id="site">
      <!-- Fixed Navigation Bar -->
      <header class="site-header" id="site-header"></header>

      <!-- Main Exhibitions Content -->
      <main class="exhibits-main">
        <h1 class="exhibits-title">Past Exhibitions</h1>

        <!-- Filter Bar -->
        <div class="exhibits-filter-bar">
          <span class="filter-bar-label">Filter Archive by:</span>

          <select id="exhibit-sort" class="exhibit-select" aria-label="Sort exhibitions">
            <option value="default">Sort: Default</option>
            <option value="az">Sort: A – Z</option>
            <option value="za">Sort: Z – A</option>
          </select>

          <span class="filter-divider" aria-hidden="true"></span>

          <div class="year-pills" role="group" aria-label="Filter by year">
            <button class="year-pill active" type="button" data-year="all">All</button>
            <button class="year-pill" type="button" data-year="2026">2026</button>
            <button class="year-pill" type="button" data-year="2025">2025</button>
            <button class="year-pill" type="button" data-year="2024">2024</button>
            <button class="year-pill" type="button" data-year="older">Older &rsaquo;</button>
          </div>

          <span class="filter-divider" aria-hidden="true"></span>

          <select id="exhibit-course" class="exhibit-select exhibit-select-course" aria-label="Filter by course">
            <option value="all">Course</option>
            <option value="Graphic Design">Graphic Design</option>
            <option value="Sculpture">Sculpture</option>
            <option value="Gateway">Gateway / All Programs</option>
          </select>

          <input
            id="exhibit-search"
            class="exhibit-search"
            type="search"
            placeholder="Search exhibitions..."
            aria-label="Search exhibitions"
          />
        </div>

        <h2 id="exhibits-results-heading" class="exhibits-results-heading">Showing All Exhibit</h2>

        <!-- Cards Grid (Populated & filtered by js/exhibitions.js) -->
        <section id="exhibits-grid" class="exhibits-grid" aria-live="polite"></section>
      </main>
    </div>

    <!-- =====================================================
         MODAL 1: EXHIBITION ARCHIVE DETAILS (Split-Screen)
         ===================================================== -->
    <div id="exhibit-modal" class="css-modal" role="dialog" aria-modal="true" aria-labelledby="exh-modal-title">
      <div class="exhibit-modal-dialog">
        <div class="exhibit-modal-media">
          <img id="exh-modal-img" src="" alt="" />
        </div>

        <div class="exhibit-modal-content">
          <button id="exh-modal-close" class="modal-close-x" type="button" aria-label="Close exhibition details">&times;</button>

          <span class="exhibit-tag-outline">EXHIBITION</span>
          <h2 id="exh-modal-title" class="exhibit-modal-title"></h2>
          <p id="exh-modal-sub" class="exhibit-modal-sub"></p>
          <p id="exh-modal-dates" class="exhibit-modal-dates"></p>

          <button id="exh-doc-btn" class="btn-doc-cta" type="button"></button>

          <hr class="exhibit-modal-hr" />

          <p id="exh-modal-desc" class="exhibit-modal-desc"></p>
          <p id="exh-modal-credit" class="exhibit-modal-credit"></p>

          <div class="exhibit-modal-footer">
            <span class="exhibit-modal-crumb">
              <svg width="16" height="18" viewBox="0 0 38 44" fill="none" aria-hidden="true">
                <defs><clipPath id="mini-sh"><path d="M2 2H36V22C36 33 19 42 19 42C19 42 2 33 2 22V2Z" /></clipPath></defs>
                <g clip-path="url(#mini-sh)">
                  <rect width="19" height="44" fill="#00447C" /><rect x="19" width="19" height="44" fill="#E6392E" />
                  <path d="M19 10H38V16H19ZM19 22H38V28H19Z" fill="#FFD23F" />
                  <circle cx="19" cy="20" r="7.5" fill="#00447C" /><path d="M19 12.5A7.5 7.5 0 0 0 19 27.5V12.5Z" fill="#FFD23F" />
                </g>
              </svg>
              / Calendar / Exhibitions
            </span>
            <button id="exh-share-btn" class="exhibit-share-btn" type="button">Share</button>
          </div>
        </div>
      </div>
    </div>

    <!-- =====================================================
         MODAL 2: EXHIBITION DOCUMENTATION LIGHTBOX
         ===================================================== -->
    <div id="doc-lightbox" class="css-modal" role="dialog" aria-modal="true" aria-labelledby="doc-lightbox-caption">
      <div class="doc-lightbox-dialog">
        <button id="doc-lightbox-close" class="modal-close-x" type="button" aria-label="Close documentation">&times;</button>
        <img id="doc-lightbox-img" class="doc-lightbox-img" src="" alt="" />
        <p id="doc-lightbox-caption" class="doc-lightbox-caption"></p>
      </div>
    </div>
    <script src="js/nav.js"></script>
    <script src="js/exhibitions.js"></script>
  </body>
</html>
