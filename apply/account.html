<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Application Account | Yale School of Art</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header" id="site-header"></header>

      <main class="apply-main">
        <div class="stepper" aria-label="Application progress">
          <a class="step-chevron active" href="account.html">1. Personal Background</a>
          <a class="step-chevron" href="step2.html">2. Program &amp; Academic</a>
          <a class="step-chevron" href="step3.html">3. Statement &amp; 3 Refs</a>
          <a class="step-chevron" href="step4.html">4. Portfolio &amp; Media</a>
          <a class="step-chevron" href="step5.html">5. Review &amp; $100 Fee</a>
        </div>

        <section class="apply-card apply-card-narrow">
          <h1 class="apply-title">Create Your Application Account</h1>
          <p class="apply-subtitle">Before beginning you must establish an account you can create your application account.</p>

          <form action="step1.html" class="form-grid" style="gap: 18px;">
            <div class="form-grid grid-2">
              <div class="field">
                <label for="first-name">First Name</label>
                <input id="first-name" type="text" placeholder="Jane" />
              </div>
              <div class="field">
                <label for="last-name">Last Name</label>
                <input id="last-name" type="text" placeholder="Doe" />
              </div>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="janedoe000@gmail.com" />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="Create a password" />
            </div>

            <div class="field">
              <label for="discipline">Primary Discipline</label>
              <select id="discipline">
                <option value="">Primary Discipline</option>
                <option value="gd">Graphic Design</option>
                <option value="pp">Painting / Printmaking</option>
                <option value="ph">Photography</option>
                <option value="sc">Sculpture</option>
              </select>
            </div>

            <a class="btn-primary-lg" href="step1.html" style="margin-top: 8px;">Create Account &amp; Continue</a>
          </form>
        </section>
      </main>
    </div>

    <script src="../js/nav.js"></script>
  </body>
</html>
